services:
  - type: web
    name: sitara-hotel-backend
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: sitara-hotel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4040

databases:
  - name: sitara-hotel-db
    plan: free
    databaseName: sitara_hotel
    user: sitara_user

