# Production profile - Aiven MySQL + Render deployment
spring.application.name=PhegonHotel
# Server Configuration
server.port=${PORT:4040}
# MySQL Connection - Aiven with SSL support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# SSL Configuration for Aiven
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Connection Pool - Optimized for free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
# AWS S3 Configuration (Optional)
aws.s3.access.key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret.key=${AWS_S3_SECRET_KEY:}
# JWT Configuration
phegon.app.jwtSecret=${JWT_SECRET:change-this-secret-in-production}
phegon.app.jwtExpirationMs=86400000
# Logging
logging.level.root=INFO
logging.level.com.phegondev.PhegonHotel=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
# Security
server.error.include-message=never
server.error.include-stacktrace=never
