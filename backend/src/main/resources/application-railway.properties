# Railway Deployment - Production Configuration
spring.application.name=PhegonHotel

# Server Configuration - Railway provides PORT variable
server.port=${PORT:4040}

# MySQL Connection - Railway provides these variables
spring.datasource.url=${MYSQLURL:jdbc:mysql://localhost:3306/sitara_hotel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Alternative: Railway also provides DATABASE_URL for MySQL
# Uncomment if you prefer using DATABASE_URL instead
# spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sitara_hotel}

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# AWS S3 Configuration (Optional)
aws.s3.access.key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret.key=${AWS_S3_SECRET_KEY:}

# JWT Configuration - Railway allows you to set custom variables
phegon.app.jwtSecret=${JWT_SECRET:please-change-this-in-railway-dashboard}
phegon.app.jwtExpirationMs=86400000

# Logging
logging.level.root=INFO
logging.level.com.phegondev.PhegonHotel=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Security
server.error.include-message=never
server.error.include-stacktrace=never

